name: Bug report
description: Report something that is not working as expected
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Gantry problem. If this involves real machine movement, include enough detail to reproduce the state safely.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, menu items, files, and settings if known.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Expected ...
        4. Actual ...
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Mock backend
        - Real GRBL serial backend
        - G-code export only
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gantry version or commit
      placeholder: v0.9.0, v1.0.0, or commit SHA
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, etc.
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: output of java -version
  - type: textarea
    id: hardware
    attributes:
      label: Hardware details, if real machine was involved
      description: Controller, GRBL version, serial port, baud rate, pen mode, machine size, origin corner.
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Did the machine move unexpectedly, fail to stop, or fail to raise the pen?
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or files
      description: Attach screenshots, SVG/project files, or relevant log text if possible.
