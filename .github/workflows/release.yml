name: Release installers

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-rc.N)'
        required: true
        default: '1.0.0-rc.2'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${REQUESTED_VERSION:-1.0.0-rc.2}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb
      - name: Locate WiX 3 tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixBin = Join-Path $env:WIX 'bin'
          if (!(Test-Path (Join-Path $wixBin 'candle.exe'))) { throw 'WiX 3 is required' }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test packaging version rules
        run: python scripts/test_release.py
      - name: Build and test release
        shell: bash
        run: python scripts/release.py "$VERSION" --installer
      - name: Install and launch Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y "./dist/$VERSION/Gantry-$VERSION-linux-x64.deb"
          xvfb-run -a python scripts/smoke_installer.py /opt/gantry/bin/Gantry "$VERSION"
          sudo apt-get remove -y gantry
          test ! -e /opt/gantry/bin/Gantry
      - name: Install and launch Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist/$env:VERSION/Gantry-$env:VERSION-windows-x64.msi").Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/L*v', 'install.log') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { Get-Content install.log; throw "Install failed: $($install.ExitCode)" }
          python scripts/smoke_installer.py 'C:/Program Files/Gantry/Gantry.exe' "$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'GUI smoke check failed' }
          $remove = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($remove.ExitCode -notin @(0, 3010)) { throw "Uninstall failed: $($remove.ExitCode)" }
          if (Test-Path 'C:/Program Files/Gantry/Gantry.exe') { throw 'Launcher remained after uninstall' }
      - name: Upload Linux release artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/${{ env.VERSION }}/*.jar
            dist/${{ env.VERSION }}/*.deb
            dist/${{ env.VERSION }}/LICENSE
            dist/${{ env.VERSION }}/README.md
          if-no-files-found: error
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/${{ env.VERSION }}/*.msi
          if-no-files-found: error
      - name: Upload test and install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            **/target/surefire-reports/*.xml
            install.log

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Verify assets and write consolidated checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "docs/release-notes/$VERSION.md"
          echo "RELEASE_NOTES=docs/release-notes/$VERSION.md" >> "$GITHUB_ENV"
          cd dist/release
          for file in "Gantry-$VERSION.jar" "Gantry-CLI-$VERSION.jar" "Gantry-$VERSION-linux-x64.deb" "Gantry-$VERSION-windows-x64.msi" LICENSE README.md; do
            test -s "$file"
            sha256sum "$file"
          done > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create draft release for final acceptance review
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: dist/release/*
