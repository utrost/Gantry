name: CI

on:
  push:
    branches: [main, master]
  # Also validate stacked PRs targeting feature branches.
  pull_request:
  # Allow release validation when an automation token suppresses PR events.
  workflow_dispatch:

jobs:
  gantry:
    name: Gantry Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Documentation links and packaging regressions
        run: |
          python3 scripts/check_doc_links.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build
        run: mvn clean package -q

      - name: Packaged CLI exports, recipes and batch failures
        run: >-
          java -Djava.awt.headless=true -cp cli/target/cli-1.0.0.jar
          scripts/validation/PackagedCliAcceptance.java
          cli/target/cli-1.0.0.jar dist/validation/packaged-cli
          docs/validation/image-art/inputs/camera.png

      - name: Real-image art geometry and G-code validation
        run: >-
          python3 scripts/validate-image-art.py
          --output dist/validation/image-art
          --baseline docs/validation/image-art/squiggle-fix/verification.json

      - name: Processor Studio Squiggle preset regression
        run: >-
          python3 scripts/validate-image-art.py
          --recipes docs/validation/image-art/squiggle-fix/studio-recipe.json
          --output dist/validation/squiggle-studio
          --baseline docs/validation/image-art/squiggle-fix/studio-verification.json

      - name: GUI mock workflow and recovery
        run: xvfb-run -a ./scripts/test-gui.sh

      - name: Workspace theme and scale layouts
        if: matrix.java == 21
        run: xvfb-run -a ./scripts/test-workspace-layouts.sh

      - name: Capture documentation screenshots
        if: matrix.java == 21
        run: xvfb-run -a ./scripts/capture-screenshots.sh

      - name: Upload documentation screenshots
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots-jdk-21
          path: docs/images/

      - name: Record mock first-plot walkthrough
        if: matrix.java == 21
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          xvfb-run -a ./scripts/record-demo.sh dist/demo

      - name: Upload mock walkthrough
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: mock-first-plot-jdk-21
          path: dist/demo/Gantry-first-plot-mock.mp4

      - name: Upload GUI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-acceptance-jdk-${{ matrix.java }}
          path: dist/validation/
          include-hidden-files: true
