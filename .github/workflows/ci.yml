name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gantry:
    name: Gantry Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn clean package -q

      - name: GUI mock workflow and recovery
        run: xvfb-run -a ./scripts/test-gui.sh

      - name: Workspace theme and scale layouts
        if: matrix.java == 21
        run: xvfb-run -a ./scripts/test-workspace-layouts.sh

      - name: Capture documentation screenshots
        if: matrix.java == 21
        run: xvfb-run -a ./scripts/capture-screenshots.sh

      - name: Upload documentation screenshots
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots-jdk-21
          path: docs/images/

      - name: Record mock first-plot walkthrough
        if: matrix.java == 21
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          xvfb-run -a ./scripts/record-demo.sh dist/demo

      - name: Upload mock walkthrough
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: mock-first-plot-jdk-21
          path: dist/demo/Gantry-first-plot-mock.mp4

      - name: Upload GUI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-acceptance-jdk-${{ matrix.java }}
          path: dist/validation/
          include-hidden-files: true
