name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gantry:
    name: Gantry Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn clean package -q

      - name: GUI mock workflow and recovery
        run: xvfb-run -a ./scripts/test-gui.sh

      - name: Upload GUI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-acceptance-jdk-${{ matrix.java }}
          path: dist/validation/gui/
          include-hidden-files: true
